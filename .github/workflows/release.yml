name: Build and deploy backend

on:
  pull_request:
    branches: ['release/**']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '已存在的版本标签，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify feature branch naming
        if: github.event_name == 'pull_request'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE_BRANCH" != feature/* ]]; then
            echo "开发分支必须使用 feature/ 前缀，当前为: $SOURCE_BRANCH"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # 当前仓库尚无 Jest 可识别的测试文件；补充测试后会自动执行。
      - run: pnpm test -- --runInBand --passWithNoTests

  publish-and-deploy:
    name: Publish image and deploy production
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - name: Verify release branch provenance
        run: |
          git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          if ! git branch -r --contains HEAD | grep -qE 'origin/release/'; then
            echo "生产版本必须来自 release/ 分支。"
            exit 1
          fi
      - name: Prepare image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}:${{ inputs.version || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: ${{ env.IMAGE }}
      - name: Update the backend on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/apps/bangni-shuochukou && BACKEND_IMAGE='$IMAGE' docker compose --env-file .env.production -f compose.yml pull bangni-backend && BACKEND_IMAGE='$IMAGE' docker compose --env-file .env.production -f compose.yml up -d --no-deps bangni-backend && docker image prune -f"
